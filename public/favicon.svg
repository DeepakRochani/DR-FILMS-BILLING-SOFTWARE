<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#darkGrad)" stroke="#f59e0b" stroke-width="3" />
  <!-- Film Reel / Camera Aperture Design -->
  <circle cx="50" cy="50" r="26" fill="none" stroke="url(#grad)" stroke-width="5" />
  <circle cx="50" cy="50" r="10" fill="url(#grad)" />
  <circle cx="50" cy="30" r="4.5" fill="#f8fafc" />
  <circle cx="50" cy="70" r="4.5" fill="#f8fafc" />
  <circle cx="30" cy="50" r="4.5" fill="#f8fafc" />
  <circle cx="70" cy="50" r="4.5" fill="#f8fafc" />
  <!-- Small film strip accent -->
  <rect x="74" y="38" width="8" height="24" rx="2" fill="url(#grad)" />
</svg>
